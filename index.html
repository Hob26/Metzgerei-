<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a1f1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wurstküche">
<title>Wurstküche Rechner</title>
<style>
:root{
  --bg:#f6f1ea; --surface:#fffdf9; --surface2:#efe6da; --ink:#2a1d17; --muted:#7d6b5f;
  --line:#e2d6c7; --accent:#9b2a22; --accent-ink:#fff; --accent-soft:#f5dcd6;
  --ok:#3d7a4a; --warn:#a86b12; --shadow:0 1px 2px rgba(60,30,10,.06),0 6px 20px rgba(60,30,10,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16110f; --surface:#211915; --surface2:#2c221d; --ink:#f3e9df; --muted:#ab9a8d;
    --line:#3a2e27; --accent:#e0624f; --accent-ink:#1a0f0c; --accent-soft:#3c211b;
    --ok:#7cc48b; --warn:#e2a54a; --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(32px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{padding:calc(18px + env(safe-area-inset-top)) 0 6px}
h1{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 2px;font-weight:600}
h2{font-size:28px;margin:0;font-weight:750;letter-spacing:-.01em}

/* Rezept-Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;margin:0 -16px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;scroll-snap-align:start;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:9px 14px;border-radius:999px;font:inherit;font-size:15px;font-weight:550;cursor:pointer}
.chip[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Menge */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin-top:14px;overflow:hidden}
.amount{padding:18px 16px 16px;text-align:center}
.amount label{display:block;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:8px}
.stepper button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:var(--ink);
  font-size:26px;line-height:1;cursor:pointer;flex:0 0 auto}
.stepper button:active{transform:scale(.94)}
.kgbox{display:flex;align-items:baseline;gap:6px}
#kg{width:140px;text-align:center;font:inherit;font-size:44px;font-weight:750;color:var(--ink);background:transparent;border:0;
  border-bottom:2px solid var(--line);padding:0 0 2px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
#kg:focus{outline:none;border-color:var(--accent)}
#kg::-webkit-outer-spin-button,#kg::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.unit{font-size:20px;color:var(--muted);font-weight:600}
.presets{display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.presets button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:6px 11px;font:inherit;font-size:14px;cursor:pointer}
.presets button.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.basis{margin-top:12px;font-size:13px;color:var(--muted);min-height:18px}
.basis b{color:var(--accent)}

/* Listen */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px 8px;border-bottom:1px solid var(--line)}
.sec-h h3{margin:0;font-size:17px}
.sec-h span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.row:last-child{border-bottom:0}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;transition:.15s}
.chk svg{opacity:0;width:14px;height:14px}
.row.done .chk{background:var(--ok);border-color:var(--ok)}
.row.done .chk svg{opacity:1}
.row.done .name,.row.done .val{opacity:.45;text-decoration:line-through}
.name{font-weight:550}
.ratio{display:block;font-size:12.5px;color:var(--muted);font-weight:400;margin-top:1px;font-variant-numeric:tabular-nums}
.val{text-align:right;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.val small{font-size:13px;color:var(--muted);font-weight:600;margin-left:3px}
.val .sub{display:block;font-size:12px;color:var(--muted);font-weight:500}
.edit{border:0;background:var(--surface2);color:var(--muted);border-radius:8px;padding:4px 7px;margin-left:8px;font-size:12px;cursor:pointer;vertical-align:middle}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:1px}
.tag.fix{background:var(--surface2);color:var(--warn)}
.tag.feel{background:var(--surface2);color:var(--muted)}
.note{font-size:12.5px;color:var(--warn);margin-top:3px;font-weight:450}

.bar{display:flex;height:8px;margin:0 16px 14px;border-radius:99px;overflow:hidden;gap:2px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:0 16px 12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;background:var(--c);vertical-align:-1px}

.foot{display:flex;gap:10px;margin-top:16px}
.foot button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:13px;font:inherit;font-weight:600;cursor:pointer}
.sum{text-align:center;color:var(--muted);font-size:13px;margin-top:14px;font-variant-numeric:tabular-nums}

/* Bottom sheet für "Ich habe X kg von ..." */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));
  max-width:560px;margin:0 auto;transform:translateY(110%);transition:transform .22s ease,visibility 0s .22s;visibility:hidden;z-index:11}
.sheet.open{transform:none;visibility:visible;transition:transform .22s ease}
.sheet h4{margin:0 0 4px;font-size:18px}
.sheet p{margin:0 0 14px;color:var(--muted);font-size:14px}
.sheet .in{display:flex;align-items:baseline;gap:8px;justify-content:center}
.sheet input{width:160px;font:inherit;font-size:36px;font-weight:750;text-align:center;border:0;border-bottom:2px solid var(--accent);background:transparent;color:var(--ink);padding:0 0 2px}
.sheet input:focus{outline:none}
.sheet .res{text-align:center;margin:12px 0 16px;color:var(--muted);font-size:14px;min-height:20px}
.sheet .btns{display:flex;gap:10px}
.sheet .btns button{flex:1;border-radius:14px;padding:13px;font:inherit;font-weight:650;cursor:pointer;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.sheet .btns .pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Wurstküche · Rechner</h1>
    <h2 id="title">Leberkäse</h2>
  </header>

  <div class="chips" id="chips" role="tablist"></div>

  <section class="card amount">
    <label for="kg">Gesamtmenge Fleisch/Brät</label>
    <div class="stepper">
      <button id="minus" aria-label="weniger">−</button>
      <div class="kgbox"><input id="kg" type="number" inputmode="decimal" min="0" step="0.5" value="5"><span class="unit">kg</span></div>
      <button id="plus" aria-label="mehr">+</button>
    </div>
    <div class="presets" id="presets"></div>
    <div class="basis" id="basis"></div>
  </section>

  <section class="card" id="meatCard">
    <div class="sec-h"><h3 id="meatTitle">Brät</h3><span id="meatSum"></span></div>
    <div style="height:12px"></div>
    <div class="bar" id="bar"></div>
    <div class="legend" id="legend"></div>
    <div id="meat" style="border-top:1px solid var(--line)"></div>
  </section>

  <section class="card">
    <div class="sec-h"><h3>Gewürze &amp; Zutaten</h3><span id="spiceSum"></span></div>
    <div id="spices"></div>
  </section>

  <div class="foot">
    <button id="reset">Häkchen zurücksetzen</button>
  </div>
  <div class="sum" id="sum"></div>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <h4 id="shTitle">Ich habe …</h4>
  <p id="shText">Menge eingeben – der Rest wird passend zur Ratio berechnet.</p>
  <div class="in"><input id="shIn" type="number" inputmode="decimal" min="0" step="0.05"><span class="unit">kg</span></div>
  <div class="res" id="shRes"></div>
  <div class="btns"><button id="shCancel">Abbrechen</button><button class="pri" id="shOk">Übernehmen</button></div>
</div>

<script>
/*
  Rezepte 1:1 aus "Metzgerei_Tabelle.xlsx" übernommen.
  Fleisch: pct = Prozent der Gesamtmenge (Excel: Gesamt/100*pct)
  Gewürze: perKg = Menge pro kg Gesamtmenge (Excel: Gesamt*perKg)
  fixed    = feste Menge, unabhängig von der Gesamtmenge (so in der Tabelle)
  feel     = keine Zahl in der Tabelle, nach Gefühl
*/
const RECIPES = [
  { id:"leberkaese", name:"Leberkäse", defaultKg:5, meatTitle:"Brät",
    meat:[
      {n:"Schweinefleisch (mager)", pct:45},
      {n:"Rindfleisch", pct:20},
      {n:"Fett", pct:15},
      {n:"Eis", pct:20},
    ],
    spices:[
      {n:"Nitritpökelsalz", perKg:19, u:"g"},
      {n:"Phosphat", perKg:2, u:"g"},
      {n:"Pök BL", perKg:1, u:"g"},
      {n:"Weißer Pfeffer", perKg:1, u:"g"},
      {n:"Macis", perKg:0.5, u:"g"},
      {n:"Koriander", perKg:0.5, u:"g"},
      {n:"Ingwer", perKg:0.125, u:"g"},
      {n:"Kardamom", perKg:0.125, u:"g"},
      {n:"Paprika", perKg:0.5, u:"g"},
      {n:"Zucker", perKg:2, u:"g"},
      {n:"Zwiebel (geschnitten)", perKg:5, u:"g"},
    ]},
  { id:"kochsalami", name:"Kochsalami", defaultKg:4, meatTitle:"Brät",
    meat:[
      {n:"Rinderbug", pct:22},
      {n:"Schweinefleisch (mager)", pct:55},
      {n:"Speck", pct:15},
      {n:"Eis", pct:8},
    ],
    spices:[
      {n:"Nitritpökelsalz", perKg:14, u:"g"},
      {n:"Kutterhilfsmittel", perKg:5, u:"g"},
      {n:"Kümmel gemahlen", perKg:0.5, u:"g"},
      {n:"Macis", perKg:0.5, u:"g"},
      {n:"Koriander", perKg:1, u:"g"},
      {n:"Senfkörner", perKg:4, u:"g"},
      {n:"Grüner Pfeffer – eingelegt", feel:true, feelText:"in Tabelle: „T“"},
      {n:"Knoblauchgranulat", fixed:3, u:"g", note:"In der Tabelle fest 3 g (skaliert nicht mit)"},
      {n:"Ascorbinsäure", perKg:1, u:"g"},
    ]},
  { id:"weisswurst", name:"Weißwurst", defaultKg:4, meatTitle:"Brät",
    meat:[
      {n:"Kalbfleisch", pct:32},
      {n:"Schweinefleisch (mager)", pct:25},
      {n:"Speck", pct:18},
      {n:"Eis", pct:25},
    ],
    spices:[
      {n:"Kochsalz", perKg:19, u:"g"},
      {n:"Phosphat", perKg:2, u:"g"},
      {n:"Weißer Pfeffer", perKg:2, u:"g"},
      {n:"Macis", perKg:1, u:"g"},
      {n:"Koriander", perKg:0.5, u:"g"},
      {n:"Ingwer", perKg:0.3, u:"g"},
      {n:"Zitronenabrieb", perKg:0.8, u:"g"},
      {n:"Petersilie", feel:true, feelText:"genau richtig"},
    ]},
  { id:"fraenkische", name:"Fränkische Bratwurst", defaultKg:4, meatTitle:"Fleisch",
    meat:[
      {n:"Schweinebauch", pct:40},
      {n:"Schweineschulter", pct:60},
    ],
    spices:[
      {n:"Salz", perKg:20, u:"g"},
      {n:"Schwarzer Pfeffer", perKg:3, u:"g"},
      {n:"Macis", perKg:0.75, u:"g"},
      {n:"Piment", perKg:0.75, u:"g"},
      {n:"Kardamom", perKg:0.25, u:"g"},
      {n:"Ingwer", perKg:0.5, u:"g"},
      {n:"Majoran", perKg:4, u:"g"},
    ]},
  { id:"coburger", name:"Coburger Bratwurst", defaultKg:2, meatTitle:"Fleisch",
    meat:[
      {n:"Schweinebauch", pct:33},
      {n:"Schweineschulter", pct:66},
    ],
    spices:[
      {n:"Salz", perKg:18, u:"g"},
      {n:"Weißer Pfeffer", perKg:4, u:"g"},
      {n:"Macis", perKg:2, u:"g"},
      {n:"Muskat", perKg:1, u:"g"},
      {n:"Zitrone", perKg:3, u:"g"},
      {n:"Ei", perKg:1, u:"Stk"},
      {n:"Milch", perKg:50, u:"ml"},
    ]},
  { id:"bratwurst", name:"Bratwurst", defaultKg:8, meatTitle:"Brät",
    meat:[
      {n:"Schweinefleisch (mager)", pct:50},
      {n:"Fett", pct:30},
      {n:"Eis", pct:20},
    ],
    spices:[
      {n:"Kochsalz", perKg:20, u:"g"},
      {n:"Phosphat", perKg:5, u:"g"},
      {n:"Weißer Pfeffer", perKg:4, u:"g"},
      {n:"Zitronenpulver", perKg:2, u:"g"},
      {n:"Macis", perKg:2, u:"g"},
      {n:"Zwiebelgranulat", perKg:1, u:"g"},
      {n:"(ohne Bezeichnung)", perKg:1, u:"g", note:"In der Tabelle steht 1 g/kg ohne Zutatennamen"},
    ]},
];

const COLORS = ["#b8432f","#d98b4a","#e8c27a","#8fb7c9","#7d9a6b","#9a7bb0"];

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const store = {
  get(k,d){ try{ const v = localStorage.getItem("wk_"+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem("wk_"+k, JSON.stringify(v)); }catch(e){} }
};
// Rundungsfehler vermeiden (z. B. 5/100*45)
const clean = x => Math.round(x*1e9)/1e9;
const fmt = (x, maxDec) => x.toLocaleString("de-DE",{minimumFractionDigits:0, maximumFractionDigits:maxDec});
function fmtGram(g){
  if (g < 1)  return fmt(g,3);
  if (g < 10) return fmt(g,2);
  return fmt(g,1);
}
function fmtKg(kg){ return fmt(kg,3); }
function fmtPerKg(v){ return fmt(v,3); }

/* ---------- State ---------- */
let current = store.get("recipe", RECIPES[0].id);
if (!RECIPES.find(r=>r.id===current)) current = RECIPES[0].id;
let kgByRecipe = store.get("kg", {});
let checks = store.get("checks", {});
let basisInfo = null; // {name, kg} wenn über Fleischmenge berechnet

const R = () => RECIPES.find(r=>r.id===current);
const getKg = () => { const v = kgByRecipe[current]; return (typeof v==="number" && v>=0) ? v : R().defaultKg; };

/* ---------- Render ---------- */
function renderChips(){
  const el = $("#chips"); el.innerHTML = "";
  RECIPES.forEach(r=>{
    const b = document.createElement("button");
    b.className="chip"; b.role="tab"; b.textContent=r.name;
    b.setAttribute("aria-selected", r.id===current);
    b.onclick=()=>{ current=r.id; store.set("recipe",current); basisInfo=null; renderAll(); b.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"}); };
    el.appendChild(b);
  });
}

function renderPresets(){
  const el=$("#presets"); el.innerHTML="";
  const kg=getKg();
  [1,2,3,4,5,8,10].forEach(v=>{
    const b=document.createElement("button");
    b.textContent=v+" kg"; if (v===kg) b.className="on";
    b.onclick=()=>setKg(v);
    el.appendChild(b);
  });
}

function checkKey(sec,i){ return current+"|"+sec+"|"+i; }

function makeRow(sec, i, nameHTML, ratioText, valHTML){
  const row=document.createElement("div");
  row.className="row"+(checks[checkKey(sec,i)]?" done":"");
  row.innerHTML = `<div class="chk"><svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg></div>
    <div class="name">${nameHTML}<span class="ratio">${ratioText}</span></div>
    <div class="val">${valHTML}</div>`;
  row.onclick=(e)=>{
    if (e.target.closest(".edit")) return;
    const k=checkKey(sec,i); checks[k]=!checks[k]; if(!checks[k]) delete checks[k];
    store.set("checks",checks); row.classList.toggle("done");
  };
  return row;
}

function renderAll(){
  const r=R(), kg=getKg();
  $("#title").textContent=r.name;
  $("#kg").value = kg;
  $("#meatTitle").textContent = r.meatTitle;
  renderChips(); renderPresets();

  $("#basis").innerHTML = basisInfo
    ? `berechnet aus <b>${fmtKg(basisInfo.kg)} kg ${basisInfo.name}</b>`
    : "";

  // Fleisch
  const meatEl=$("#meat"); meatEl.innerHTML="";
  const bar=$("#bar"), leg=$("#legend"); bar.innerHTML=""; leg.innerHTML="";
  let pctSum=0, meatKgSum=0;
  r.meat.forEach((m,i)=>{
    const amount = clean(kg/100*m.pct);
    pctSum+=m.pct; meatKgSum+=amount;
    const g = clean(amount*1000);
    const valHTML = `${fmtKg(amount)}<small>kg</small><span class="sub">${fmt(g,1)} g</span>`;
    const row = makeRow("m",i, `${m.n}<button class="edit" data-i="${i}" aria-label="Menge vorgeben">ich habe …</button>`, `${fmt(m.pct,2)} %`, valHTML);
    meatEl.appendChild(row);
    const c=COLORS[i%COLORS.length];
    const seg=document.createElement("i"); seg.style.width=m.pct+"%"; seg.style.background=c; bar.appendChild(seg);
    const l=document.createElement("span"); l.style.setProperty("--c",c); l.textContent=`${m.n} ${fmt(m.pct,2)} %`; leg.appendChild(l);
  });
  meatKgSum=clean(meatKgSum);
  $("#meatSum").textContent = `${fmtKg(meatKgSum)} kg · ${fmt(pctSum,2)} %`;
  if (pctSum!==100){
    const n=document.createElement("div"); n.className="row"; n.style.cursor="default"; n.style.gridTemplateColumns="1fr";
    n.innerHTML=`<div class="note">Achtung: Die Fleischanteile in der Tabelle ergeben ${fmt(pctSum,2)} % statt 100 % – Werte wurden exakt so übernommen.</div>`;
    meatEl.appendChild(n);
  }
  meatEl.querySelectorAll(".edit").forEach(b=>b.onclick=(e)=>{e.stopPropagation(); openSheet(+b.dataset.i);});

  // Gewürze
  const spEl=$("#spices"); spEl.innerHTML="";
  let gSum=0;
  r.spices.forEach((s,i)=>{
    let nameHTML=s.n, ratio="", val="";
    if (s.feel){
      nameHTML += `<span class="tag feel">nach Gefühl</span>`;
      ratio = s.feelText || "";
      val = `<span style="color:var(--muted);font-size:15px;font-weight:600">—</span>`;
    } else if (s.fixed!==undefined){
      nameHTML += `<span class="tag fix">fix</span>`;
      ratio = `fest ${fmtGram(s.fixed)} ${s.u}`;
      val = `${fmtGram(s.fixed)}<small>${s.u}</small>`;
      if (s.u==="g") gSum+=s.fixed;
    } else {
      const amount = clean(kg*s.perKg);
      ratio = `${fmtPerKg(s.perKg)} ${s.u}/kg`;
      if (s.u==="Stk"){
        val = `${fmt(amount,2)}<small>Stk</small>`;
      } else if (s.u==="ml"){
        val = `${fmt(amount,1)}<small>ml</small>`;
      } else {
        val = `${fmtGram(amount)}<small>g</small>`;
        gSum+=amount;
      }
    }
    if (s.note) ratio += `<div class="note">${s.note}</div>`;
    spEl.appendChild(makeRow("s",i,nameHTML,ratio,val));
  });
  gSum=clean(gSum);
  $("#spiceSum").textContent = `${fmtGram(gSum)} g Gewürze`;
  $("#sum").textContent = `Gesamt: ${fmtKg(meatKgSum)} kg ${r.meatTitle} + ${fmtGram(gSum)} g Gewürze`;
}

function setKg(v, keepBasis){
  v = Math.max(0, clean(+v||0));
  kgByRecipe[current]=v; store.set("kg",kgByRecipe);
  if(!keepBasis) basisInfo=null;
  renderAll();
}

/* ---------- Events ---------- */
$("#kg").addEventListener("input", e=>{
  const v=parseFloat(String(e.target.value).replace(",","."));
  if (isNaN(v)) return;
  kgByRecipe[current]=Math.max(0,v); store.set("kg",kgByRecipe); basisInfo=null;
  // Eingabefeld nicht neu schreiben, während getippt wird
  const keep=e.target.value; renderAll(); $("#kg").value=keep;
});
$("#minus").onclick=()=>setKg(Math.max(0, getKg()-0.5));
$("#plus").onclick=()=>setKg(getKg()+0.5);
$("#reset").onclick=()=>{
  Object.keys(checks).forEach(k=>{ if(k.startsWith(current+"|")) delete checks[k]; });
  store.set("checks",checks); renderAll();
};

/* ---------- Bottom-Sheet: aus vorhandener Fleischmenge rechnen ---------- */
let sheetIdx=null;
function openSheet(i){
  sheetIdx=i; const m=R().meat[i];
  $("#shTitle").textContent=`Ich habe … ${m.n}`;
  $("#shText").textContent=`${m.n} ist ${fmt(m.pct,2)} % der Gesamtmenge. Gib ein, wie viel du davon hast – alles andere wird passend berechnet.`;
  const cur=clean(getKg()/100*m.pct);
  $("#shIn").value=cur; updateSheet();
  $("#sheetBg").style.display="block";
  requestAnimationFrame(()=>$("#sheet").classList.add("open"));
  setTimeout(()=>{ $("#shIn").focus(); $("#shIn").select(); },230);
}
function closeSheet(){ $("#sheet").classList.remove("open"); setTimeout(()=>$("#sheetBg").style.display="none",220); }
function sheetTotal(){
  const v=parseFloat(String($("#shIn").value).replace(",","."));
  if (isNaN(v)||v<0) return null;
  return {have:v,total:clean(v/(R().meat[sheetIdx].pct/100))};
}
function updateSheet(){
  const t=sheetTotal();
  $("#shRes").innerHTML = t ? `→ Gesamtmenge <b style="color:var(--ink)">${fmtKg(t.total)} kg</b>` : "";
}
$("#shIn").addEventListener("input",updateSheet);
$("#shIn").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#shOk").click(); });
$("#shCancel").onclick=closeSheet; $("#sheetBg").onclick=closeSheet;
$("#shOk").onclick=()=>{
  const t=sheetTotal(); if(!t) return;
  basisInfo={name:R().meat[sheetIdx].n, kg:t.have};
  setKg(t.total,true); closeSheet();
};

renderAll();
</script>
</body>
</html>
